<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendrier de l'Avent — WoW Forever</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>⚔️ Calendrier de l'Avent — WoW Forever 🛡️</h1>
      <p class="sous-titre">
        Pour la gloire de l'Alliance, une case par jour en attendant le 5
        novembre !
      </p>
      <div id="compte-a-rebours"></div>
      <p class="etoiles">✦ ✦ ✦ ✦ ✦</p>
    </header>

    <main id="grille"></main>

    <footer>
      « La Drôme c'est un peu l'Alliance, et l'Ardèche c'est un peu la Horde...
      » — J.B.
    </footer>

    <div id="voile">
      <div class="modale">
        <span class="categorie" id="m-categorie"></span>
        <h2 id="m-titre"></h2>
        <div class="contenu" id="m-contenu"></div>
        <div class="defi-bloc" id="defi-bloc">
          <span class="defi-titre">🎯 Défi du jour</span>
          <p id="m-defi"></p>
        </div>
        <button class="fermer" id="btn-fermer">Fermer le trésor</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
